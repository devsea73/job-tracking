appId: com.jobtracker.lan
productName: Job Tracker
directories:
  output: dist
  buildResources: build

# Native modules ship ready-made N-API binaries, so nothing is compiled while packaging.
npmRebuild: false
nodeGypRebuild: false

files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/node_modules/better-sqlite3/{deps,src,binding.gyp}{,/**}'
  - '!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl,win32-arm64}*'
  - '!**/node_modules/argon2/prebuilds/{darwin,linux,freebsd}*{,/**}'
  - '!**/node_modules/argon2/{argon2,binding.gyp}{,/**}'

# Native binaries cannot load from inside the archive. Playwright reads its own files by
# path while launching the system browser.
asarUnpack:
  - '**/*.node'
  - '**/node_modules/playwright-core/**'

extraResources:
  - from: drizzle
    to: drizzle
  - from: build/icon.png
    to: icon.png

electronLanguages:
  - en-US

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Job Tracker
  artifactName: Job-Tracker-Setup-${version}.${ext}
  # Keeps the database when the app is uninstalled or upgraded.
  deleteAppDataOnUninstall: false
